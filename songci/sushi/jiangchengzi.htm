      <header class="poem-detail__header">
        <h1 class="poem-detail__title">江城子·乙卯正月二十日夜记梦</h1>
        <p class="poem-detail__meta">苏轼 · 宋代词人 · 词</p>
      </header>
      <p class="poem-detail__text">十年生死两茫茫，不思量，自难忘。
千里孤坟，无处话凄凉。
纵使相逢应不识，尘满面，鬓如霜。
夜来幽梦忽还乡，小窗梳妆，相顾无言，惟有泪千行。
料得年年肠断处，明月夜，短松冈。</p>
      <section class="poem-detail__notes">
        <span class="section-label">注 释</span>
        <p>悼亡妻王弗之作，于平淡语中见至深之哀。</p>
      </section>
      <section class="poem-detail__bg">
        <span class="section-label">创作背景</span>
        <p>熙宁八年（1075）正月，苏轼梦见亡妻王弗，醒而记梦。</p>
      </section>
