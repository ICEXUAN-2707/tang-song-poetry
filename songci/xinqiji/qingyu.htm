      <header class="poem-detail__header">
        <h1 class="poem-detail__title">青玉案·元夕</h1>
        <p class="poem-detail__meta">辛弃疾 · 宋代词人 · 词</p>
      </header>
      <p class="poem-detail__text">东风夜放花千树，更吹落、星如雨。
宝马雕车香满路。
凤箫声动，玉壶光转，一夜鱼龙舞。
蛾儿雪柳黄金缕，笑语盈盈暗香去。
众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。</p>
      <section class="poem-detail__notes">
        <span class="section-label">注 释</span>
        <p>“众里寻他”一句由热闹反衬孤高，寄寓深意。</p>
      </section>
      <section class="poem-detail__bg">
        <span class="section-label">创作背景</span>
        <p>辛弃疾闲居时作，借元夕灯市写不遇之慨。</p>
      </section>
