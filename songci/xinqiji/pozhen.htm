      <header class="poem-detail__header">
        <h1 class="poem-detail__title">破阵子·为陈同甫赋壮词以寄之</h1>
        <p class="poem-detail__meta">辛弃疾 · 宋代词人 · 词</p>
      </header>
      <p class="poem-detail__text">醉里挑灯看剑，梦回吹角连营。
八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。
马作的卢飞快，弓如霹雳弦惊。
了却君王天下事，赢得生前身后名。
可怜白发生！</p>
      <section class="poem-detail__notes">
        <span class="section-label">注 释</span>
        <p>结句陡转“可怜白发生”，壮语忽作悲音。</p>
      </section>
      <section class="poem-detail__bg">
        <span class="section-label">创作背景</span>
        <p>辛弃疾寄友人陈亮（同甫）的壮词，写报国理想与现实落空。</p>
      </section>
