      <header class="poem-detail__header">
        <h1 class="poem-detail__title">一剪梅·红藕香残玉簟秋</h1>
        <p class="poem-detail__meta">李清照 · 宋代词人 · 词</p>
      </header>
      <p class="poem-detail__text">红藕香残玉簟秋。轻解罗裳，独上兰舟。
云中谁寄锦书来，雁字回时，月满西楼。
花自飘零水自流。一种相思，两处闲愁。
此情无计可消除，才下眉头，却上心头。</p>
      <section class="poem-detail__notes">
        <span class="section-label">注 释</span>
        <p>抒夫妻别后相思，“才下眉头，却上心头”工巧动人。</p>
      </section>
      <section class="poem-detail__bg">
        <span class="section-label">创作背景</span>
        <p>李清照与赵明诚离别后所作，写闺中相思之切。</p>
      </section>
