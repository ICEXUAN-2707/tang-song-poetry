    <!-- 全局错误浮层：任何脚本错误都会显示在页面顶部，避免「白屏但不知原因」 -->
    <script>
        window.addEventListener("error", function (e) {
            var box = document.getElementById("errorOverlay");
            if (!box) {
                box = document.createElement("div");
                box.id = "errorOverlay";
                box.style.cssText =
                    "position:fixed;left:0;right:0;top:0;z-index:9999;" +
                    "background:#7a1f1f;color:#fff;font:13px/1.6 system-ui,sans-serif;" +
                    "padding:12px 18px;white-space:pre-wrap;box-shadow:0 2px 10px rgba(0,0,0,.3)";
                document.body.appendChild(box);
            }
            box.textContent = "⚠ 脚本错误：" + (e.message || e.error) +
                (e.filename ? "\n@ " + e.filename + ":" + e.lineno : "");
        });
    </script>
</head>

    <a href="#main-content" class="skip-link">跳到主要内容</a>
