        <h1 class="poem-detail__title">夜雨寄北</h1>
        <p class="poem-detail__meta">李商隐 · 唐代诗人 · 七言绝句</p>
      </header>
      <p class="poem-detail__text">君问归期未有期，巴山夜雨涨秋池。
何当共剪西窗烛，却话巴山夜雨时。</p>
      <section class="poem-detail__notes">
        <span class="section-label">注 释</span>
        <p>虚实相生，以“巴山夜雨”今昔重沓见深情。</p>
      </section>
      <section class="poem-detail__bg">
        <span class="section-label">创作背景</span>
        <p>作于李商隐滞留巴蜀、寄内（或友）抒思念之时。</p>
      </section>
