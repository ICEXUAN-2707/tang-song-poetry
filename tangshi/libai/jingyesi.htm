        <h1 class="poem-detail__title">静夜思</h1>
        <p class="poem-detail__meta">李白 · 唐代诗人 · 五言绝句</p>
      </header>
      <p class="poem-detail__text">床前明月光，疑是地上霜。
举头望明月，低头思故乡。</p>
      <section class="poem-detail__notes">
        <span class="section-label">注 释</span>
        <p>语言极浅而意味极深，是传诵最广的思乡绝唱。</p>
      </section>
      <section class="poem-detail__bg">
        <span class="section-label">创作背景</span>
        <p>一般认为作于李白青年时期离乡漫游、夜宿异乡之时。</p>
      </section>
