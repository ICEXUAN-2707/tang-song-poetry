      <header class="poem-detail__header">
        <h1 class="poem-detail__title">月下独酌</h1>
        <p class="poem-detail__meta">李白 · 唐代诗人 · 五言古诗</p>
      </header>
      <p class="poem-detail__text">花间一壶酒，独酌无相亲。
举杯邀明月，对影成三人。
月既不解饮，影徒随我身。
暂伴月将影，行乐须及春。
我歌月徘徊，我舞影零乱。
醒时同交欢，醉后各分散。
永结无情游，相期邈云汉。</p>
      <section class="poem-detail__notes">
        <span class="section-label">注 释</span>
        <p>三、四句以奇想将明月与身影拉为饮伴，于极致的孤独中写尽豪放。</p>
      </section>
      <section class="poem-detail__bg">
        <span class="section-label">创作背景</span>
        <p>约作于天宝三载（744）长安，李白政治抱负受挫、借酒遣怀之作。</p>
      </section>
