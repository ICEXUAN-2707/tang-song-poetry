      <header class="poem-detail__header">
        <h1 class="poem-detail__title">登高</h1>
        <p class="poem-detail__meta">杜甫 · 唐代诗人 · 七言律诗</p>
      </header>
      <p class="poem-detail__text">风急天高猿啸哀，渚清沙白鸟飞回。
无边落木萧萧下，不尽长江滚滚来。
万里悲秋常作客，百年多病独登台。
艰难苦恨繁霜鬓，潦倒新停浊酒杯。</p>
      <section class="poem-detail__notes">
        <span class="section-label">注 释</span>
        <p>被誉为“古今七律第一”，悲秋亦悲身世，沉郁顿挫。</p>
      </section>
      <section class="poem-detail__bg">
        <span class="section-label">创作背景</span>
        <p>大历二年（767）秋，杜甫流寓夔州，重阳登高感时伤己而作。</p>
      </section>
