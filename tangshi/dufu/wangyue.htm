      <header class="poem-detail__header">
        <h1 class="poem-detail__title">望岳</h1>
        <p class="poem-detail__meta">杜甫 · 唐代诗人 · 五言古诗</p>
      </header>
      <p class="poem-detail__text">岱宗夫如何？齐鲁青未了。
造化钟神秀，阴阳割昏晓。
荡胸生曾云，决眦入归鸟。
会当凌绝顶，一览众山小。</p>
      <section class="poem-detail__notes">
        <span class="section-label">注 释</span>
        <p>末二句抒登顶之志，气象阔大，为青年杜甫明志之作。</p>
      </section>
      <section class="poem-detail__bg">
        <span class="section-label">创作背景</span>
        <p>约作于开元二十四年（736）前后，杜甫漫游齐鲁、初见泰山时。</p>
      </section>
